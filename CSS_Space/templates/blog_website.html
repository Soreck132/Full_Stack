<!DOCTYPE html>
<html>

<head>
    <title>Blog</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 1100px;
            margin: auto;
        }

        main {
            flex: 3;
            padding: 20px;
        }

        article {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 6px;
        }

        aside {
            flex: 1;
            padding: 20px;
        }

        .widget {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Blog</h1>
    </header>

    <div class="container">

        <main>

            <article>
                <h2>Article Title</h2>
                <p>Blog content...</p>
            </article>

            <article>
                <h2>Another Article</h2>
                <p>More content...</p>
            </article>

        </main>

        <aside>

            <div class="widget">
                <h3>Categories</h3>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                </ul>
            </div>

        </aside>

    </div>

</body>

</html>
