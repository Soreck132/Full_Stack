<!DOCTYPE html>
<html>

<head>
    <title>Landing Page</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5
        }

        header {
            background: #2563eb;
            color: white;
            padding: 60px;
            text-align: center;
        }

        section {
            padding: 60px;
            text-align: center
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .1);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Amazing Product</h1>
        <p>Make your life easier</p>
        <button>Get Started</button>
    </header>

    <section>
        <h2>Features</h2>

        <div class="features">
            <div class="card">Fast</div>
            <div class="card">Secure</div>
            <div class="card">Easy</div>
        </div>

    </section>

</body>

</html>
