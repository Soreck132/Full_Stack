<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .sidebar li {
            list-style: none;
            margin: 15px 0;
        }

        .content {
            flex: 1;
            background: #f3f4f6;
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Dashboard</h2>
            <ul>
                <li>Users</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="content">

            <h1>Overview</h1>

            <div class="cards">

                <div class="card">Users: 120</div>
                <div class="card">Sales: $5000</div>
                <div class="card">Visits: 12k</div>

            </div>

        </main>

    </div>

</body>

</html>
