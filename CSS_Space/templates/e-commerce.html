<!DOCTYPE html>
<html>

<head>
    <title>Store</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f6f6f6
        }

        header {
            background: #111;
            color: white;
            padding: 15px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
        }

        button {
            background: #10b981;
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Store</h1>
    </header>

    <section class="products">

        <div class="product">
            <h3>Product 1</h3>
            <p>$20</p>
            <button>Buy</button>
        </div>

        <div class="product">
            <h3>Product 2</h3>
            <p>$30</p>
            <button>Buy</button>
        </div>

        <div class="product">
            <h3>Product 3</h3>
            <p>$25</p>
            <button>Buy</button>
        </div>

    </section>

</body>

</html>
